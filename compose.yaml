x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: student-mental-health-airflow:3.4.0
  environment: &airflow-environment
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__PARALLELISM: '2'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '2'
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
    AIRFLOW_ARTIFACTS_DIR: /opt/airflow/artifacts
    PYTHONPATH: /opt/airflow/project
  volumes: &airflow-volumes
    - ./dags:/opt/airflow/project/dags:ro
    - ./data/raw:/opt/airflow/project/data/raw:ro
    - airflow-artifacts:/opt/airflow/artifacts
    - airflow-logs:/opt/airflow/logs
    - airflow-auth:/opt/airflow/auth
  networks:
    - ml-platform

services:
  postgres:
    image: postgres:16.8
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ml-platform
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: ["bash", "/opt/airflow/init.sh"]
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  airflow-apiserver:
    <<: *airflow-common
    command: ["airflow", "api-server"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: ["airflow", "dag-processor"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit/Dockerfile
    image: student-mental-health-streamlit:local
    volumes:
      - ./models:/opt/project/models:ro
      - ./reports:/opt/project/reports:ro
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
    networks:
      - ml-platform
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-artifacts:
  airflow-logs:
  airflow-auth:

networks:
  ml-platform:
    driver: bridge
